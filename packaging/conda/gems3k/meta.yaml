{% set version = environ["GEMS3K_VERSION"] %}

package:
  name: gems3k
  version: {{ version }}

source:
  git_url: {{ environ.get("GEMS3K_REPO", "https://github.com/gemshub/GEMS3K.git") }}
  git_rev: {{ environ.get("GEMS3K_REV", environ.get("GEMS3K_BRANCH", "develop_optima")) }}

build:
  number: {{ environ.get("XGEM2MT_BUILD_NUMBER", 900) }}  # set by the workflow: 1000 + run number, so every run gets new file names
  string: optima_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
    - git
  host:
    - optima * optima*
    - thermofun >=0.7.1
    - chemicalfun
    - eigen >=3.4.0
    - spdlog
    - nlohmann_json >=3.7.0
    - autodiff
  run:
    - thermofun >=0.7.1
    - optima * optima*  # the exported GEMS3K targets link Optima::Optima; this is the build from this channel

test:
  commands:
    - test -f ${PREFIX}/lib/cmake/GEMS3K/GEMS3KConfig.cmake  # [unix]
    - if exist %LIBRARY_PREFIX%\lib\cmake\GEMS3K\GEMS3KConfig.cmake (exit 0) else (exit 1)  # [win]

about:
  home: https://github.com/gemshub/GEMS3K
  license: LGPL-3.0-or-later
  summary: GEMS3K (develop_optima branch, Optima linked in) for the xgem2mt prerelease - TEST BUILD.
