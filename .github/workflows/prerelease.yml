# Prerelease: builds optima + gems3k (develop_optima) + xgem2mt (this checkout) as conda packages and
# publishes them as a conda channel on the gh-pages branch of this repo:
#   https://gemshub.github.io/xgem2mt/prerelease
# Each run replaces the channel. Publishing a GitHub release (Releases > Draft a new release, tag for example
# v1.0.4) runs it and attaches the packages to that release; the install notes are added below its text.
# A manual run (Actions > prerelease > Run workflow) only updates the channel.
# Install:
#   conda create -n xgem2mt -c https://gemshub.github.io/xgem2mt/prerelease -c conda-forge xgem2mt
# Requires: repo Settings > Pages > source = branch gh-pages (after the first run creates it).
name: prerelease
on:
  release:
    types: [published]   # a release, or a pre-release, made on GitHub
  workflow_dispatch:

permissions:
  contents: read   # the publish job asks for write access itself

concurrency:
  group: ${{ github.workflow }}   # one run at a time updates the channel on gh-pages
  cancel-in-progress: false

# ---- Settings: edit here ----------------------------------------------------------------------
env:
  BASE_PACKAGES: "optima gems3k"            # python-independent recipes under RECIPE_ROOT, built once, in order
  PUBLISH_PACKAGES: "optima gems3k xgem2mt" # these go into the channel and the release
  PYTHON_PACKAGES: "xgem2mt"                # recipes built once per python version below
  PYTHON_VERSIONS: "3.12 3.13 3.14"         # a version missing from the conda-forge pinning is skipped with a warning
  RECIPE_ROOT: packaging/conda
  UPSTREAM_CHANNEL: conda-forge
  CHANNEL_NAME: prerelease                  # served at https://<owner>.github.io/<repo>/<CHANNEL_NAME>
  PAGES_DIR: site                           # staging dir published to the gh-pages branch
  BUILD_DIR: channel                        # conda-build output folder
  ARTIFACT_PREFIX: channel                  # per-platform artifact name prefix
  # Source repos and branches. The resolve job turns each branch into one commit (OPTIMA_REV, GEMS3K_REV),
  # so that all platforms build the same source; the recipes read these through jinja environ.get(...)
  OPTIMA_REPO: https://github.com/gemshub/optima.git
  OPTIMA_BRANCH: optima_develop
  GEMS3K_REPO: https://github.com/gemshub/GEMS3K.git
  GEMS3K_BRANCH: develop_optima
# xgem2mt itself is built from the tag (or branch) this workflow runs on. A tag must be v<version> or
# v<version>-<suffix> (for example v1.0.4 or v1.0.4-rc1), with <version> from CMakeLists.txt.
# ------------------------------------------------------------------------------------------------

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      optima_rev: ${{ steps.r.outputs.optima_rev }}
      gems3k_rev: ${{ steps.r.outputs.gems3k_rev }}
      gems3k_version: ${{ steps.r.outputs.gems3k_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag, pin the Optima and GEMS3K commits, read the GEMS3K version
        id: r
        run: |
          XV="$(sed -n 's/^project(xGEM2MT VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$XV" ] || { echo "::error::xGEM2MT version not found in CMakeLists.txt"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "${GITHUB_REF_NAME#v}" in
              "$XV"|"$XV"-*) ;;
              *) echo "::error::tag $GITHUB_REF_NAME does not match the CMakeLists.txt version $XV (use v$XV or v$XV-<suffix>)"; exit 1 ;;
            esac
          fi
          rev() {  # rev <repo> <branch> -> commit SHA of the branch head
            local r; r="$(git ls-remote "$1" "refs/heads/$2" | cut -f1)"
            [ -n "$r" ] || { echo "::error::branch $2 not found in $1" >&2; return 1; }
            echo "$r"
          }
          OREV="$(rev "$OPTIMA_REPO" "$OPTIMA_BRANCH")"
          GREV="$(rev "$GEMS3K_REPO" "$GEMS3K_BRANCH")"
          RAW="${GEMS3K_REPO%.git}/${GREV}/CMakeLists.txt"
          RAW="${RAW/github.com/raw.githubusercontent.com}"
          GV="$(curl -fsSL "$RAW" | sed -n 's/^project(GEMS3K VERSION \([0-9.]*\).*/\1/p')"
          [ -n "$GV" ] || { echo "::error::GEMS3K version not found in $RAW"; exit 1; }
          echo "Optima $OPTIMA_BRANCH @ $OREV, GEMS3K $GEMS3K_BRANCH @ $GREV (version $GV), xGEM2MT $XV"
          { echo "optima_rev=$OREV"; echo "gems3k_rev=$GREV"; echo "gems3k_version=$GV"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.os }}
    env:
      OPTIMA_REV: ${{ needs.resolve.outputs.optima_rev }}
      GEMS3K_REV: ${{ needs.resolve.outputs.gems3k_rev }}
      GEMS3K_VERSION: ${{ needs.resolve.outputs.gems3k_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest,  subdir: linux-64}
          - {os: macos-latest,   subdir: osx-arm64}
          - {os: windows-latest, subdir: win-64}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: 26.7.2-1   # 26.9.4-0 fails in "conda init --all" on Windows; unpin when fixed
          channels: ${{ env.UPSTREAM_CHANNEL }}
          channel-priority: strict
          auto-activate-base: true
      - name: Install conda-build
        shell: bash -el {0}
        run: conda install -n base -y conda-build conda-forge-pinning  # base: that is where `conda build` is looked up
      - name: Build base packages once, then python packages per python version
        shell: bash -el {0}
        run: |
          PIN="$(conda info --base)/conda_build_config.yaml"
          build() {  # build() <recipe> [--variants "<variant>"]
            local r="$1"; shift
            conda build "$RECIPE_ROOT/$r" -m "$PIN" "$@" --output-folder "$BUILD_DIR" -c "$UPSTREAM_CHANNEL"
          }
          for p in $BASE_PACKAGES; do build "$p" || { echo "::error::base package $p failed"; exit 1; }; done
          for v in $PYTHON_VERSIONS; do
            if ! VARIANT=$(python "$RECIPE_ROOT/python_variant.py" "$PIN" "$v"); then
              echo "::warning::python $v is not in the conda-forge pinning yet - skipped"; continue
            fi
            for p in $PYTHON_PACKAGES; do
              build "$p" --variants "$VARIANT" || {
                echo "::warning::$p failed for python $v"
                echo "- $p failed for python $v on ${{ matrix.subdir }}" >> "$GITHUB_STEP_SUMMARY"
              }
            done
          done
      - name: Collect the packages to publish
        shell: bash -el {0}
        run: |
          mkdir -p publish
          for p in $PUBLISH_PACKAGES; do cp "$BUILD_DIR/${{ matrix.subdir }}/$p"-[0-9]*.conda publish/ || true; done
          ls publish
          ls publish/xgem2mt-*.conda >/dev/null 2>&1 || { echo "::error::no xgem2mt package was built"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-${{ matrix.subdir }}
          path: publish/*.conda
          if-no-files-found: error

  publish:
    needs: [resolve, build]
    # Publish also when one platform fails (for example Windows): the channel then holds the platforms that built.
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPTIMA_REV: ${{ needs.resolve.outputs.optima_rev }}
      GEMS3K_REV: ${{ needs.resolve.outputs.gems3k_rev }}
      IS_FINAL: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: 26.7.2-1
          channels: ${{ env.UPSTREAM_CHANNEL }}
      - name: Index the channel and write the notes
        shell: bash -el {0}
        run: |
          ls dl/$ARTIFACT_PREFIX-* >/dev/null 2>&1 || { echo "::error::no platform built"; exit 1; }
          conda install -y conda-index
          CH="$PAGES_DIR/$CHANNEL_NAME"
          mkdir -p "$CH/noarch" assets
          for d in dl/$ARTIFACT_PREFIX-*; do
            sub=${d#dl/$ARTIFACT_PREFIX-}
            mkdir -p "$CH/$sub"; cp "$d"/* "$CH/$sub/"
            for f in "$d"/*.conda; do cp "$f" "assets/$sub-$(basename "$f")"; done
          done
          python -m conda_index "$CH"
          find "$CH" -name .cache -prune -exec rm -rf {} +
          touch "$PAGES_DIR/.nojekyll"
          URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${CHANNEL_NAME}"
          PKGS=$(cd "$CH" && ls */*.conda | sed 's#^#- #')
          cat > notes.md <<EON
          $( [ "$IS_FINAL" = true ] && echo "xGEM2MT conda packages." || echo "Test build of xGEM2MT. Not a final release." )

          GEMS3K is built from \`${GEMS3K_BRANCH}\` at ${GEMS3K_REV}, with Optima from \`${OPTIMA_BRANCH}\` at ${OPTIMA_REV}.
          Other dependencies come from conda-forge.

          ## Install

          \`\`\`bash
          conda create -n xgem2mt -c ${URL} -c conda-forge xgem2mt
          \`\`\`

          Packages are built for Linux (linux-64), macOS on Apple Silicon (osx-arm64) and Windows (win-64).
          There are no packages for Intel Macs (osx-64).

          The channel holds the latest build. The packages of this build are also attached below.

          ## Packages

          ${PKGS}

          Built from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME} (${GITHUB_SHA}). Platforms and Python versions not listed are not available.
          EON
          ( echo '<!doctype html><meta charset="utf-8"><title>xgem2mt prerelease channel</title><pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g' notes.md; echo '</pre>' ) > "$CH/index.html"
          cat notes.md
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PAGES_DIR }}
      - name: Attach the packages and the install notes to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          R="-R $GITHUB_REPOSITORY"
          # Drop the files of an earlier run, so that a package that did not build this time is not left behind
          gh release view "$TAG" $R --json assets --jq '.assets[].name' |
            while read -r a; do gh release delete-asset "$TAG" "$a" -y $R; done
          gh release upload "$TAG" assets/* --clobber $R
          # Keep the text written on GitHub; put the generated notes below a marker, replacing those of an earlier run
          M='<!-- conda-packages -->'
          gh release view "$TAG" $R --json body --jq .body | awk -v m="$M" '$0 == m {exit} {print}' |
            sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > body.md   # without trailing blank lines
          { cat body.md; echo; echo "$M"; cat notes.md; } > release.md
          gh release edit "$TAG" --notes-file release.md $R
